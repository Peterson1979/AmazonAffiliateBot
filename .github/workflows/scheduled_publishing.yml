name: Scheduled Amazon Affiliate Publishing

on:
  schedule:
    # Candidate triggers at both UTC offsets for the 13:00 and 19:00
    # Europe/Budapest slots. The runner accepts late starts and claims due
    # slots durably before any live adapter is called.
    # - CEST (Summer, UTC+2): 11:00 UTC = 13:00 CEST, 17:00 UTC = 19:00 CEST
    # - CET  (Winter, UTC+1): 12:00 UTC = 13:00 CET,  18:00 UTC = 19:00 CET
    - cron: '0 11,12,17,18 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Use simulation mode instead of sending live posts (development/testing only)'
        required: true
        type: boolean
        default: false
      ignore_window:
        description: 'Bypass Europe/Budapest hour window check (publish due items immediately)'
        required: true
        type: boolean
        default: false
      now_override:
        description: 'Optional ISO timestamp override for simulation (e.g. 2026-10-11T19:05:00+02:00)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: publishing-queue-lock
  cancel-in-progress: false

jobs:
  publish:
    name: Evaluate & Publish Scheduled Queue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify evidence-backed publishing state
        run: |
          python -m unittest tests.test_truthful_dashboard_states tests.test_publisher

      - name: Claim Due Budapest Slots
        id: claim
        if: github.event_name == 'schedule'
        env:
          EVENT_NAME: ${{ github.event_name }}
          NOW_OVERRIDE: ${{ github.event.inputs.now_override }}
        run: |
          python scripts/run_cloud_publisher.py --claim-only

      - name: Persist Slot Claims Before Publishing
        if: steps.claim.outputs.claim_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/queue/publishing_queue.json
          if git diff --staged --quiet; then
            echo "No slot claim changes to commit."
          else
            git commit -m "Claim scheduled publishing slot [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Safety gate: fails the workflow before any publishing starts when a
      # due item is missing its content package, so no item can be marked
      # FAILED by a missing package and no other item publishes either.
      # Read-only: it never mutates the queue or triggers publishing.
      - name: Verify content packages before publishing
        id: preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          NOW_OVERRIDE: ${{ github.event.inputs.now_override }}
          REQUIRE_SLOT_CLAIM: ${{ github.event_name == 'schedule' }}
        run: |
          python scripts/preflight_content_packages.py

      - name: Run Cloud Publisher
        id: publisher
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DRY_RUN: ${{ github.event.inputs.dry_run }}
          IGNORE_WINDOW: ${{ github.event.inputs.ignore_window }}
          NOW_OVERRIDE: ${{ github.event.inputs.now_override }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN || secrets.META_ACCESS_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_LIFEMODEHQ_ACCESS_TOKEN: ${{ secrets.PINTEREST_LIFEMODEHQ_ACCESS_TOKEN }}
          REQUIRE_SLOT_CLAIM: ${{ github.event_name == 'schedule' }}
        run: |
          python scripts/run_cloud_publisher.py ${{ github.event_name == 'schedule' && '--execute-claimed' || '' }}

      - name: Persist Queue and Logs
        if: always() && steps.publisher.outputs.queue_updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/queue/publishing_queue.json data/logs/daily_publisher.log
          if git diff --staged --quiet; then
            echo "No queue changes to commit."
          else
            echo "Persisting updated queue and logs back to repository..."
            git commit -m "Automated publishing update [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

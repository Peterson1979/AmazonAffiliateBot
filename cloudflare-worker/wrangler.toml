name = "amazon-affiliate-publishing-cron"
main = "src/index.js"
compatibility_date = "2024-04-01"

[vars]
GITHUB_OWNER = "Peterson1979"
GITHUB_REPO = "AmazonAffiliateBot"
WORKFLOW_FILE = "scheduled_publishing.yml"
EVENT_TYPE = "cloudflare-scheduled-publish"
CHECK_ACTIVE_RUNS = "true"

[triggers]
crons = [
  # Europe/Budapest publishing windows: 15:00, 18:00, 21:00, 23:00.
  # Europe/Budapest observes CET (UTC+1, winter) and CEST (UTC+2, summer).
  # Summer (CEST, UTC+2): 13:00, 16:00, 19:00, 21:00 UTC
  # Winter (CET,  UTC+1): 14:00, 17:00, 20:00, 22:00 UTC
  #
  # Triggers at 13, 14, 16, 17, 19, 20, 21, 22 UTC daily (covers both daylight periods).
  # Additional :15 run provides automatic retry/catch-up if a transient API error occurs.
  # Out-of-season triggers are dropped inside worker code without dispatching.
  "0,15 13,14,16,17,19,20,21,22 * * *"
]

